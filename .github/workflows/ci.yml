name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: PG_MDM_E2E_IMAGE=pg_mdm:test PG_MDM_E2E_TARGET=tester scripts/build_e2e_image.sh
      - run: docker run --rm pg_mdm:test cargo fmt -- --check
      - run: docker run --rm pg_mdm:test cargo clippy --all-targets --features pg18 -- -D warnings
      - run: docker run --rm pg_mdm:test cargo test --lib --features pg18
      - run: docker run --rm -e LC_ALL=C pg_mdm:test cargo test --test normalization_tests --test e2e_candidate_spec_tests --features pg18
      - run: docker run --rm pg_mdm:test cargo test --test organization_quality_tests --features pg18 -- --nocapture | tee organization-quality.log
      - run: docker run --rm pg_mdm:test cargo test --test stewardship_contract_tests --features pg18
      - run: docker run --rm pg_mdm:test cargo pgrx test pg18 --features pg_test
      - run: docker run --rm pg_mdm:test scripts/check_security_definer.sh
      - run: docker run --rm pg_mdm:test python3 scripts/check_upgrade_paths.py
      - run: docker run --rm pg_mdm:test bash -c "generated=\$(find /package -name 'pg_mdm--0.12.0.sql' -type f -print -quit); test -n \"\$generated\"; cmp \"\$generated\" sql/archive/pg_mdm--0.12.0.sql"
      - run: docker run --rm pg_mdm:test python3 scripts/package_manifest.py /package > package-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: pg_mdm-0.12.0-test-evidence
          path: |
            package-manifest.json
            organization-quality.log
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: scripts/run_e2e_tests.sh | tee "$RUNNER_TEMP/e2e.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg_mdm-0.12.0-e2e-log
          path: ${{ runner.temp }}/e2e.log
          if-no-files-found: warn
