name: Release package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and attach to its release
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)"
          test "${RELEASE_TAG}" = "v${version}"

      - name: Build and archive package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="pg_mdm-${version}-pg18-linux-amd64.tar.gz"
          docker build --platform linux/amd64 --target builder --tag pg_mdm-release .
          container="pg-mdm-package-${GITHUB_RUN_ID}"
          docker create --name "${container}" pg_mdm-release >/dev/null
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist/package
          docker cp "${container}:/package/." dist/package/
          docker rm "${container}"
          python3 scripts/package_manifest.py dist/package > dist/package-manifest.json
          generated="$(find dist/package -name "pg_mdm--${version}.sql" -type f -print -quit)"
          test -n "${generated}"
          cmp "${generated}" "sql/archive/pg_mdm--${version}.sql"
          tar -czf "dist/${archive}" -C dist package package-manifest.json
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Upload package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="pg_mdm-${version}-pg18-linux-amd64.tar.gz"
          gh release upload "${RELEASE_TAG}" \
            "dist/${archive}" \
            "dist/${archive}.sha256" \
            dist/package-manifest.json \
            --clobber
