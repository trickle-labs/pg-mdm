[package]
name = "pg_mdm"
version = "0.11.0"
edition = "2024"
rust-version = "1.98"
description = "Deterministic entity resolution and golden records for PostgreSQL"
license = "Apache-2.0"
repository = "https://github.com/grove/pg-mdm"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "=0.1.25"

[dev-dependencies]
proptest = "1"
pgrx-tests = "=0.18.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
