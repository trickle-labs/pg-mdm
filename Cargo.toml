[package]
name = "pg_mdm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Deterministic entity resolution and golden records for PostgreSQL"
license = "Apache-2.0"
repository = "https://github.com/grove/pg-mdm"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
pgrx-tests = "=0.18.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "json"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
